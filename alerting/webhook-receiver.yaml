apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: openobserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-webhook
  template:
    metadata:
      labels:
        app: alert-webhook
    spec:
      containers:
        - name: webhook
          image: mendhak/http-https-echo:37
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: openobserve
spec:
  selector:
    app: alert-webhook
  ports:
    - port: 8080
      targetPort: 8080
